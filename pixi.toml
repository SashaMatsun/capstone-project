# Software environment of this project. Edit it with `pixi add <package>`;
# Pixi records the exact versions it installed in pixi.lock (commit both).
[workspace]
name = "capstone-project"
description = "Evaluation of transcriptomics effect of IFNB1 stimulation on single cell lupus PBMC"
authors = ["Aleksandr Matsun <aleksandr.matsun@mbzuai.ac.ae>"]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]
version = "0.1.0"

[dependencies]
python = "3.13.*"
quarto = ">=1.9"
jupyterlab = ">=4"
ipykernel = ">=7"
pandas = ">=2"
matplotlib = ">=3.9"
papermill = ">=2.6"   # Quarto needs it for report parameters (-P)

[tasks]
check = { cmd = "python --version && quarto --version", description = "Check that the tools work" }
download = { cmd = "python scripts/download_data.py" }
verify-data = { cmd = "python scripts/download_data.py --verify-only" }
reproduce = { depends-on = [{ task = "run-snakemake", environment = "pipeline" }] }

[feature.pipeline]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[feature.pipeline.dependencies]
snakemake = ">=9.27.1,<10"
numpy = ">=2.5.5,<3"
scipy = ">=1.18.1,<2"
anndata = ">=0.13.4,<0.14"

[feature.pipeline.pypi-dependencies]
rds2py = { version = "==0.10.6", extras = ["optional"] }

[feature.pipeline.tasks]
run-snakemake = { cmd = "snakemake --snakefile workflow/Snakefile --cores 2 --rerun-incomplete", depends-on = ["download"] }
dry-run = { cmd = "snakemake --snakefile workflow/Snakefile --cores 2 --dry-run" }

[environments]
pipeline = ["pipeline"]